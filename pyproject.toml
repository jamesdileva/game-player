[project]
name = "agb"
version = "0.1.0"
description = "AnyGame-Bench: a local harness that benchmarks AI agents in any running game via screen pixels and mouse/keyboard input."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "mss>=9.0",
    "pygetwindow>=0.0.9",
    "pydirectinput>=1.0.4",
    "pynput>=1.7.6",
    "Pillow>=10.0",
    "typer>=0.12",
    "pygame-ce>=2.5",  # community edition; classic pygame has no py3.14 wheels
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
agb = "agb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ui: tests that open real windows and inject input (deselect with -m 'not ui')",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "testbed"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
